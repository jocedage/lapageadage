<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulateur de Course d'Animaux</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; color: #333; min-height: 100vh; overflow-x: hidden; }
  h1 { text-align: center; padding: 18px 0 10px; font-size: 1.6rem; background: linear-gradient(135deg, #e94560, #0f3460); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px; }
  .controls { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 10px 20px; flex-wrap: wrap; }
  .controls label { font-size: 0.9rem; font-weight: 600; color: #444; }
  .controls select, .controls button { padding: 8px 16px; border-radius: 8px; border: none; font-size: 0.9rem; cursor: pointer; }
  .controls select { background: #fff; color: #333; border: 1px solid #c0c8d4; }
  #btnPlay { background: linear-gradient(135deg, #e94560, #c23152); color: #fff; font-weight: 700; font-size: 1rem; padding: 10px 28px; transition: transform 0.15s, box-shadow 0.15s; }
  #btnPlay:hover { transform: scale(1.05); box-shadow: 0 4px 20px rgba(233,69,96,.3); }
  #btnPlay:disabled { opacity: 0.5; transform: none; cursor: not-allowed; }
  #btnReset { background: #fff; color: #444; border: 1px solid #c0c8d4; font-weight: 600; }
  #btnReset:hover { background: #e8ecf1; }
  .params-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 900px; margin: 8px auto; padding: 0 20px; }
  .param-card { background: #fff; border-radius: 10px; padding: 12px 14px; border-left: 4px solid; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .param-card:nth-child(1) { border-left-color: #e94560; }
  .param-card:nth-child(2) { border-left-color: #f5a623; }
  .param-card:nth-child(3) { border-left-color: #4fc3f7; }
  .param-card h3 { font-size: 0.85rem; margin-bottom: 8px; color: #333; }
  .param-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 0.8rem; }
  .param-row label { min-width: 100px; color: #555; }
  .param-row input[type="number"] { width: 72px; padding: 4px 8px; border-radius: 6px; border: 1px solid #c0c8d4; background: #f5f7fa; color: #333; font-size: 0.85rem; text-align: center; }
  .param-row span { font-size: 0.75rem; color: #999; }
  .main-area { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 12px 20px 20px; max-width: 1500px; margin: 0 auto; }
  .panel { background: #fff; border-radius: 14px; padding: 16px; min-height: 500px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .panel h2 { font-size: 1rem; margin-bottom: 10px; color: #2c6fce; }
  canvas { display: block; width: 100%; border-radius: 8px; }
  .winner-banner { text-align: center; font-size: 1.3rem; font-weight: 700; padding: 10px; margin: 8px 20px 0; border-radius: 10px; background: linear-gradient(135deg, #e94560, #0f3460); color: #fff; display: none; animation: popIn 0.4s ease-out; }
  @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .legend { display: flex; gap: 18px; justify-content: center; margin-top: 8px; font-size: 0.8rem; color: #555; }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
  @media (max-width: 900px) { .main-area { grid-template-columns: 1fr; } .params-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<h1>Simulateur de Course d&#39;Animaux</h1>

<div class="controls">
  <label for="animalType">Type d&#39;animal :</label>
  <select id="animalType">
    <option value="tortue">&#x1F422; Tortues</option>
    <option value="renard">&#x1F98A; Renards</option>
    <option value="cheval" selected>&#x1F434; Chevaux</option>
    <option value="guepard">&#x1F406; Gu&eacute;pards</option>
  </select>
  <label for="speedUnit">Unit&eacute; :</label>
  <select id="speedUnit">
    <option value="ms" selected>m/s</option>
    <option value="kmh">km/h</option>
  </select>
  <label for="trackLength">Piste :</label>
  <input type="number" id="trackLength" value="100" min="10" step="10" style="width:80px;padding:6px 10px;border-radius:8px;border:1px solid #c0c8d4;background:#f5f7fa;color:#333;font-size:0.9rem;text-align:center;">
  <span style="font-size:0.8rem;color:#999;">m</span>
  <button id="btnPlay">&#x25B6; D&eacute;marrer</button>
  <button id="btnReset">&#x21BA; R&eacute;initialiser</button>
</div>

<div class="params-grid" id="paramsGrid"></div>

<div id="winnerBanner" class="winner-banner"></div>

<div class="main-area">
  <div class="panel">
    <h2>&#x1F3C1; Piste de course</h2>
    <canvas id="raceCanvas"></canvas>
    <div class="legend" id="raceLegend"></div>
  </div>
  <div class="panel">
    <h2>&#x1F4CA; Position vs Temps</h2>
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px;font-size:0.8rem;color:#555;">
      <div style="display:flex;gap:14px;align-items:center;">
        <span style="font-weight:700;color:#2c6fce;min-width:50px;">Axe X :</span>
        <div style="display:flex;align-items:center;gap:4px;">
          <label for="graphMaxX" style="font-weight:600;">Max :</label>
          <input type="number" id="graphMaxX" value="100" min="1" step="1" style="width:60px;padding:3px 6px;border-radius:6px;border:1px solid #c0c8d4;background:#f5f7fa;color:#333;font-size:0.8rem;text-align:center;">
          <span style="color:#999;">s</span>
        </div>
        <div style="display:flex;align-items:center;gap:4px;">
          <label for="graphStepX" style="font-weight:600;">Pas :</label>
          <input type="number" id="graphStepX" value="10" min="1" step="1" style="width:60px;padding:3px 6px;border-radius:6px;border:1px solid #c0c8d4;background:#f5f7fa;color:#333;font-size:0.8rem;text-align:center;">
          <span style="color:#999;">s</span>
        </div>
      </div>
      <div style="display:flex;gap:14px;align-items:center;">
        <span style="font-weight:700;color:#2c6fce;min-width:50px;">Axe Y :</span>
        <div style="display:flex;align-items:center;gap:4px;">
          <label for="graphMaxY" style="font-weight:600;">Max :</label>
          <input type="number" id="graphMaxY" value="100" min="1" step="10" style="width:70px;padding:3px 6px;border-radius:6px;border:1px solid #c0c8d4;background:#f5f7fa;color:#333;font-size:0.8rem;text-align:center;">
          <span style="color:#999;">m</span>
        </div>
        <div style="display:flex;align-items:center;gap:4px;">
          <label for="graphStepY" style="font-weight:600;">Pas :</label>
          <input type="number" id="graphStepY" value="20" min="1" step="5" style="width:70px;padding:3px 6px;border-radius:6px;border:1px solid #c0c8d4;background:#f5f7fa;color:#333;font-size:0.8rem;text-align:center;">
          <span style="color:#999;">m</span>
        </div>
      </div>
    </div>
    <canvas id="graphCanvas"></canvas>
    <div class="legend" id="graphLegend"></div>
  </div>
</div>

<script>
var COLORS = ['#e94560', '#f5a623', '#2196f3'];
var TRACK_LENGTH = 100;

/* Default speeds in m/s – all 1 m/s, no delay */
var ANIMAL_DATA = {
  tortue:  { emoji: '\u{1F422}', name: 'Tortue',       defaultSpeed: [1, 1, 1], defaultDelay: [0, 0, 0] },
  renard:  { emoji: '\u{1F98A}', name: 'Renard',       defaultSpeed: [1, 1, 1], defaultDelay: [0, 0, 0] },
  cheval:  { emoji: '\u{1F434}', name: 'Cheval',       defaultSpeed: [1, 1, 1], defaultDelay: [0, 0, 0] },
  guepard: { emoji: '\u{1F406}', name: 'Gu\u00E9pard', defaultSpeed: [1, 1, 1], defaultDelay: [0, 0, 0] }
};

var raceCanvas, raceCtx, graphCanvas, graphCtx;
var animating = false;
var startTime = 0;
var raceData = [];
var graphPoints = [];
var winner = -1;
var lastFrameTime = 0;
var raceFinished = false;
var rankings = [];

function getUnit() {
  return document.getElementById('speedUnit').value; // 'ms' or 'kmh'
}

function getUnitLabel() {
  return getUnit() === 'kmh' ? 'km/h' : 'm/s';
}

function msToDisplay(val) {
  if (getUnit() === 'kmh') return +(val * 3.6).toFixed(2);
  return val;
}

function displayToMs(val) {
  if (getUnit() === 'kmh') return val / 3.6;
  return val;
}

function init() {
  raceCanvas = document.getElementById('raceCanvas');
  graphCanvas = document.getElementById('graphCanvas');
  raceCtx = raceCanvas.getContext('2d');
  graphCtx = graphCanvas.getContext('2d');

  window.addEventListener('resize', resizeCanvases);
  document.getElementById('animalType').addEventListener('change', buildParams);
  document.getElementById('btnPlay').addEventListener('click', startRace);
  document.getElementById('btnReset').addEventListener('click', resetRace);

  document.getElementById('speedUnit').addEventListener('change', onUnitChange);

  document.getElementById('trackLength').addEventListener('input', onTrackLengthChange);

  document.getElementById('graphMaxX').addEventListener('input', function() { if (!animating) drawGraphStatic(); });
  document.getElementById('graphStepX').addEventListener('input', function() { if (!animating) drawGraphStatic(); });
  document.getElementById('graphMaxY').addEventListener('input', function() { if (!animating) drawGraphStatic(); });
  document.getElementById('graphStepY').addEventListener('input', function() { if (!animating) drawGraphStatic(); });

  buildParams();
  resizeCanvases();
  drawRaceStatic();
  drawGraphStatic();
}

function onTrackLengthChange() {
  var tl = parseFloat(document.getElementById('trackLength').value) || 100;
  document.getElementById('graphMaxY').value = tl;
  // Smart step: pick a nice round step
  var step = tl <= 50 ? 10 : tl <= 200 ? 20 : tl <= 500 ? 50 : tl <= 1000 ? 100 : 200;
  document.getElementById('graphStepY').value = step;
  if (!animating) drawGraphStatic();
}

function onUnitChange() {
  var isKmh = getUnit() === 'kmh';
  // Convert current speed values in inputs
  for (var i = 0; i < 3; i++) {
    var el = document.getElementById('speed' + i);
    if (el) {
      var val = parseFloat(el.value) || 0;
      if (isKmh) {
        // was m/s, now km/h
        el.value = +(val * 3.6).toFixed(2);
        el.step = '0.5';
      } else {
        // was km/h, now m/s
        el.value = +(val / 3.6).toFixed(2);
        el.step = '0.1';
      }
    }
  }
  // Update unit labels
  var labels = document.querySelectorAll('.speed-unit-label');
  for (var j = 0; j < labels.length; j++) {
    labels[j].textContent = getUnitLabel();
  }
}

function setupHiDPI(canvas, w, h) {
  var dpr = window.devicePixelRatio || 1;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  var ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function resizeCanvases() {
  var racePanel = raceCanvas.parentElement;
  var graphPanel = graphCanvas.parentElement;
  setupHiDPI(raceCanvas, racePanel.clientWidth - 32, 300);
  setupHiDPI(graphCanvas, graphPanel.clientWidth - 32, 450);
  raceCtx = raceCanvas.getContext('2d');
  graphCtx = graphCanvas.getContext('2d');
  if (!animating) { drawRaceStatic(); drawGraphStatic(); }
}

function buildParams() {
  var type = document.getElementById('animalType').value;
  var data = ANIMAL_DATA[type];
  var grid = document.getElementById('paramsGrid');
  var unitLabel = getUnitLabel();
  var stepAttr = getUnit() === 'kmh' ? '0.5' : '0.1';

  grid.innerHTML = '';
  for (var i = 0; i < 3; i++) {
    var displaySpeed = msToDisplay(data.defaultSpeed[i]);
    var card = document.createElement('div');
    card.className = 'param-card';
    card.innerHTML =
      '<h3>' + data.emoji + ' ' + data.name + ' ' + (i + 1) + ' <span style="color:' + COLORS[i] + '">\u25A0</span></h3>' +
      '<div class="param-row">' +
        '<label>Vitesse :</label>' +
        '<input type="number" id="speed' + i + '" value="' + displaySpeed + '" min="0.1" step="' + stepAttr + '">' +
        '<span class="speed-unit-label">' + unitLabel + '</span>' +
      '</div>' +
      '<div class="param-row">' +
        '<label>D\u00E9lai d\u00E9part :</label>' +
        '<input type="number" id="delay' + i + '" value="' + data.defaultDelay[i] + '" min="0" step="0.1">' +
        '<span>s</span>' +
      '</div>';
    grid.appendChild(card);
  }
  buildLegends(data);
  resetRace();
}

function buildLegends(data) {
  var raceLeg = document.getElementById('raceLegend');
  var graphLeg = document.getElementById('graphLegend');
  raceLeg.innerHTML = '';
  graphLeg.innerHTML = '';
  for (var i = 0; i < 3; i++) {
    var html = '<div class="legend-item"><div class="legend-dot" style="background:' + COLORS[i] + '"></div>' +
      data.emoji + ' ' + data.name + ' ' + (i + 1) + '</div>';
    raceLeg.innerHTML += html;
    graphLeg.innerHTML += html;
  }
}

function getParams() {
  var params = [];
  for (var i = 0; i < 3; i++) {
    var rawSpeed = parseFloat(document.getElementById('speed' + i).value) || 1;
    var speedMs = displayToMs(rawSpeed);
    params.push({
      speed: speedMs,
      delay: parseFloat(document.getElementById('delay' + i).value) || 0
    });
  }
  return params;
}

function startRace() {
  if (animating) return;
  TRACK_LENGTH = parseFloat(document.getElementById('trackLength').value) || 100;
  var params = getParams();
  raceData = params.map(function(p) {
    return { position: 0, speed: p.speed, delay: p.delay, finished: false, finishTime: null };
  });
  graphPoints = [[], [], []];
  winner = -1;
  raceFinished = false;
  rankings = [];
  document.getElementById('winnerBanner').style.display = 'none';
  animating = true;
  document.getElementById('btnPlay').disabled = true;
  startTime = performance.now();
  lastFrameTime = startTime;
  requestAnimationFrame(animate);
}

function resetRace() {
  animating = false;
  raceData = [];
  graphPoints = [[], [], []];
  winner = -1;
  raceFinished = false;
  rankings = [];
  document.getElementById('btnPlay').disabled = false;
  document.getElementById('winnerBanner').style.display = 'none';
  drawRaceStatic();
  drawGraphStatic();
}

function animate(now) {
  if (!animating) return;
  var elapsed = (now - startTime) / 1000;
  var allFinished = true;
  for (var i = 0; i < 3; i++) {
    var d = raceData[i];
    if (d.finished) continue;
    var activeTime = Math.max(0, elapsed - d.delay);
    d.position = Math.min(TRACK_LENGTH, activeTime * d.speed);
    if (now - lastFrameTime > 40 || d.position >= TRACK_LENGTH) {
      graphPoints[i].push({ t: elapsed, pos: d.position });
    }
    if (d.position >= TRACK_LENGTH) {
      d.finished = true;
      d.finishTime = elapsed;
      if (winner === -1) { winner = i; }
    } else { allFinished = false; }
  }
  if (now - lastFrameTime > 40) { lastFrameTime = now; }
  drawRace(elapsed);
  drawGraph(elapsed);
  if (allFinished) {
    animating = false;
    document.getElementById('btnPlay').disabled = false;
    showWinner();
    for (var i = 0; i < 3; i++) {
      var last = graphPoints[i][graphPoints[i].length - 1];
      if (!last || last.pos < TRACK_LENGTH) { graphPoints[i].push({ t: elapsed, pos: raceData[i].position }); }
    }
    drawGraph(elapsed);
  } else { requestAnimationFrame(animate); }
}

function showWinner() {
  var type = document.getElementById('animalType').value;
  var data = ANIMAL_DATA[type];
  var banner = document.getElementById('winnerBanner');
  banner.style.display = 'block';
  rankings = raceData.map(function(d, i) { return { i: i, time: d.finishTime }; }).sort(function(a, b) { return a.time - b.time; });
  raceFinished = true;
  banner.innerHTML = '\u{1F3C6} ' + data.emoji + ' ' + data.name + ' ' + (rankings[0].i + 1) + ' gagne en ' + rankings[0].time.toFixed(2) + 's !<br>' +
    '<span style="font-size:0.8rem">' +
      '\u{1F948} ' + data.name + ' ' + (rankings[1].i + 1) + ' : ' + rankings[1].time.toFixed(2) + 's &nbsp;|&nbsp;' +
      '\u{1F949} ' + data.name + ' ' + (rankings[2].i + 1) + ' : ' + rankings[2].time.toFixed(2) + 's</span>';
  // Redraw race to show medals
  var ctx = raceCtx;
  var s = getLogicalSize(raceCanvas);
  ctx.clearRect(0, 0, s.w, s.h);
  ctx.fillStyle = '#eaf0f6';
  ctx.fillRect(0, 0, s.w, s.h);
  var positions = raceData.map(function(d) { return d.position / TRACK_LENGTH; });
  drawTrack(ctx, s.w, s.h, positions);
}

/* =================== RACE DRAWING =================== */
function getLogicalSize(canvas) {
  return { w: parseFloat(canvas.style.width), h: parseFloat(canvas.style.height) };
}

function drawRaceStatic() {
  var ctx = raceCtx;
  var s = getLogicalSize(raceCanvas);
  ctx.clearRect(0, 0, s.w, s.h);
  ctx.fillStyle = '#eaf0f6';
  ctx.fillRect(0, 0, s.w, s.h);
  drawTrack(ctx, s.w, s.h, [0, 0, 0]);
}

function drawRace(elapsed) {
  var ctx = raceCtx;
  var s = getLogicalSize(raceCanvas);
  ctx.clearRect(0, 0, s.w, s.h);
  ctx.fillStyle = '#eaf0f6';
  ctx.fillRect(0, 0, s.w, s.h);
  var positions = raceData.map(function(d) { return d.position / TRACK_LENGTH; });
  drawTrack(ctx, s.w, s.h, positions, elapsed);
}

function drawTrack(ctx, W, H, positions, elapsed) {
  var margin = { left: 50, right: 20, top: 44, bottom: 20 };
  var trackW = W - margin.left - margin.right;
  var trackH = H - margin.top - margin.bottom;
  var laneH = trackH / 3;
  var type = document.getElementById('animalType').value;
  var emoji = ANIMAL_DATA[type].emoji;

  // Timer
  if (elapsed !== undefined) {
    ctx.fillStyle = '#333';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'top';
    ctx.fillText('\u{23F1} ' + elapsed.toFixed(1) + 's', W - 10, 4);
  }

  // Lanes
  for (var i = 0; i < 3; i++) {
    var y = margin.top + i * laneH;
    ctx.fillStyle = i % 2 === 0 ? '#ffffff' : '#f3f6fa';
    ctx.fillRect(margin.left, y, trackW, laneH);
    ctx.strokeStyle = '#d0d8e4';
    ctx.lineWidth = 1;
    ctx.strokeRect(margin.left, y, trackW, laneH);
    ctx.fillStyle = COLORS[i];
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillText('#' + (i + 1), margin.left - 8, y + laneH / 2);
  }

  // Distance markers
  ctx.fillStyle = '#8899aa';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'center';
  var dStep = TRACK_LENGTH / 5;
  for (var d = 0; d <= TRACK_LENGTH; d += dStep) {
    var x = margin.left + (d / TRACK_LENGTH) * trackW;
    ctx.fillText(Math.round(d) + 'm', x, margin.top - 8);
    ctx.strokeStyle = '#d0d8e4';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(x, margin.top);
    ctx.lineTo(x, margin.top + trackH);
    ctx.stroke();
  }

  // Start line
  ctx.strokeStyle = '#2196f3';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(margin.left, margin.top);
  ctx.lineTo(margin.left, margin.top + trackH);
  ctx.stroke();

  // Finish checkerboard
  var finishX = margin.left + trackW;
  var checkSize = 8;
  for (var row = 0; row < Math.ceil(trackH / checkSize); row++) {
    for (var col = 0; col < 3; col++) {
      ctx.fillStyle = (row + col) % 2 === 0 ? '#333' : '#fff';
      ctx.fillRect(finishX - checkSize * 1.5 + col * checkSize, margin.top + row * checkSize, checkSize, checkSize);
    }
  }

  // Animals
  for (var i = 0; i < 3; i++) {
    var frac = positions[i] || 0;
    var x = margin.left + frac * trackW;
    var y = margin.top + i * laneH + laneH / 2;
    if (frac > 0) {
      var grad = ctx.createLinearGradient(margin.left, 0, x, 0);
      grad.addColorStop(0, 'transparent');
      grad.addColorStop(1, COLORS[i] + '44');
      ctx.fillStyle = grad;
      ctx.fillRect(margin.left, margin.top + i * laneH + 4, x - margin.left, laneH - 8);
    }
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(-1, 1);
    ctx.font = '28px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(emoji, 0, 0);
    ctx.restore();
    if (elapsed !== undefined && raceData[i] && elapsed < raceData[i].delay) {
      var remaining = (raceData[i].delay - elapsed).toFixed(1);
      ctx.fillStyle = '#e94560';
      ctx.font = 'bold 11px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('\u{23F1} ' + remaining + 's', x, y - 22);
    }
  }

  // Medals
  if (raceFinished && rankings.length === 3) {
    var medals = ['\u{1F947}', '\u{1F948}', '\u{1F949}'];
    var medalColors = ['#FFD700', '#C0C0C0', '#CD7F32'];
    var medalBorders = ['#B8860B', '#808080', '#8B4513'];
    var radius = Math.min(laneH / 2 - 4, 30);
    for (var r = 0; r < 3; r++) {
      var laneIdx = rankings[r].i;
      var my = margin.top + laneIdx * laneH + laneH / 2;
      var mx = margin.left + trackW / 2;
      ctx.fillStyle = medalColors[r] + '30';
      ctx.fillRect(margin.left, margin.top + laneIdx * laneH, trackW, laneH);
      ctx.beginPath();
      ctx.arc(mx, my, radius, 0, Math.PI * 2);
      ctx.fillStyle = medalColors[r];
      ctx.fill();
      ctx.strokeStyle = medalBorders[r];
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(mx, my, radius, 0, Math.PI * 2);
      ctx.strokeStyle = '#ffffff88';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      var emojiSize = Math.round(radius * 1.1);
      ctx.font = emojiSize + 'px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(medals[r], mx, my);
    }
  }
}

/* =================== GRAPH DRAWING =================== */
function getGraphSettings() {
  return {
    maxX: parseFloat(document.getElementById('graphMaxX').value) || 100,
    stepX: parseFloat(document.getElementById('graphStepX').value) || 10,
    maxY: parseFloat(document.getElementById('graphMaxY').value) || 100,
    stepY: parseFloat(document.getElementById('graphStepY').value) || 20
  };
}

function drawGraphStatic() {
  var ctx = graphCtx;
  var s = getLogicalSize(graphCanvas);
  ctx.clearRect(0, 0, s.w, s.h);
  ctx.fillStyle = '#f5f7fb';
  ctx.fillRect(0, 0, s.w, s.h);
  var gs = getGraphSettings();
  drawAxes(ctx, s.w, s.h, gs.maxX, gs.stepX, gs.maxY, gs.stepY);
}

function drawGraph(elapsed) {
  var ctx = graphCtx;
  var s = getLogicalSize(graphCanvas);
  ctx.clearRect(0, 0, s.w, s.h);
  ctx.fillStyle = '#f5f7fb';
  ctx.fillRect(0, 0, s.w, s.h);
  var gs = getGraphSettings();
  drawAxes(ctx, s.w, s.h, gs.maxX, gs.stepX, gs.maxY, gs.stepY);
  drawCurves(ctx, s.w, s.h, gs.maxX, gs.maxY);
}

function drawAxes(ctx, W, H, maxT, tStep, maxY, pStep) {
  var margin = { left: 55, right: 20, top: 20, bottom: 45 };
  var plotW = W - margin.left - margin.right;
  var plotH = H - margin.top - margin.bottom;

  ctx.strokeStyle = '#dce3ed';
  ctx.lineWidth = 0.5;

  for (var t = 0; t <= maxT; t += tStep) {
    var x = margin.left + (t / maxT) * plotW;
    ctx.beginPath(); ctx.moveTo(x, margin.top); ctx.lineTo(x, margin.top + plotH); ctx.stroke();
    ctx.fillStyle = '#778899'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('' + t, x, margin.top + plotH + 16);
  }

  for (var p = 0; p <= maxY; p += pStep) {
    var y = margin.top + plotH - (p / maxY) * plotH;
    ctx.beginPath(); ctx.moveTo(margin.left, y); ctx.lineTo(margin.left + plotW, y); ctx.stroke();
    ctx.fillStyle = '#778899'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText('' + p, margin.left - 8, y);
  }

  ctx.strokeStyle = '#99aabb'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(margin.left, margin.top); ctx.lineTo(margin.left, margin.top + plotH); ctx.lineTo(margin.left + plotW, margin.top + plotH); ctx.stroke();

  ctx.fillStyle = '#556677'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('Temps (s)', margin.left + plotW / 2, H - 6);
  ctx.save(); ctx.translate(14, margin.top + plotH / 2); ctx.rotate(-Math.PI / 2);
  ctx.fillText('Position (m)', 0, 0); ctx.restore();

  var finishY = margin.top + plotH - (TRACK_LENGTH / maxY) * plotH;
  ctx.strokeStyle = '#e9456066'; ctx.lineWidth = 1;
  ctx.setLineDash([6, 4]); ctx.beginPath(); ctx.moveTo(margin.left, finishY); ctx.lineTo(margin.left + plotW, finishY); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = '#e94560aa'; ctx.font = '9px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('Arriv\u00E9e', margin.left + plotW - 40, finishY + 12);
}

function drawCurves(ctx, W, H, maxT, maxY) {
  var margin = { left: 55, right: 20, top: 20, bottom: 45 };
  var plotW = W - margin.left - margin.right;
  var plotH = H - margin.top - margin.bottom;
  for (var i = 0; i < 3; i++) {
    var pts = graphPoints[i];
    if (!pts || pts.length < 2) continue;
    ctx.strokeStyle = COLORS[i]; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.beginPath();
    for (var j = 0; j < pts.length; j++) {
      var x = margin.left + (pts[j].t / maxT) * plotW;
      var y = margin.top + plotH - (pts[j].pos / maxY) * plotH;
      if (j === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    var last = pts[pts.length - 1];
    var lx = margin.left + (last.t / maxT) * plotW;
    var ly = margin.top + plotH - (last.pos / maxY) * plotH;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(lx, ly, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = COLORS[i]; ctx.beginPath(); ctx.arc(lx, ly, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = COLORS[i]; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(Math.round(last.pos) + 'm', lx + 10, ly + 4);
  }
}
