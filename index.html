    <style>
        /* Effet Liquid Glass signature */
        .liquid-glass {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(24px) saturate(190%);
            -webkit-backdrop-filter: blur(24px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.65);
            box-shadow: 
                0 10px 30px -10px rgba(30, 39, 97, 0.08),
                inset 0 1px 2px rgba(255, 255, 255, 0.85),
                inset 0 -1px 2px rgba(0, 0, 0, 0.01);
        }
        
        .liquid-glass-hover {
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .liquid-glass-hover:hover {
            background: rgba(255, 255, 255, 0.75);
            border-color: rgba(64, 142, 198, 0.35);
            box-shadow: 
                0 20px 40px -15px rgba(30, 39, 97, 0.12),
                inset 0 1px 2px rgba(255, 255, 255, 0.95);
            transform: translateY(-6px) scale(1.015);
        }

        /* Animation de pulsation douce du symbole infini */
        @keyframes custom-blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.1); }
        }
        
        .flashing-symbol {
            animation: custom-blink 2s infinite ease-in-out;
            display: inline-block;
        }

        /* Orbes fluides de fond */
        @keyframes liquid-float-1 {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.15); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }
        @keyframes liquid-float-2 {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            50% { transform: translate(-40px, 30px) scale(1.2); }
        }
        @keyframes liquid-float-3 {
            0%, 100% { transform: translate(0px, 0px) scale(1.1); }
            40% { transform: translate(40px, 30px) scale(0.95); }
        }
        
        .animate-fluid-1 { animation: liquid-float-1 22s ease-in-out infinite; }
        .animate-fluid-2 { animation: liquid-float-2 28s ease-in-out infinite; }
        .animate-fluid-3 { animation: liquid-float-3 20s ease-in-out infinite; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f9f9f9; }
        ::-webkit-scrollbar-thumb {
            background: rgba(30, 39, 97, 0.15);
            border-radius: 9999px;
            border: 2px solid #f9f9f9;
        }
        ::-webkit-scrollbar-thumb:hover { background: rgba(30, 39, 97, 0.25); }
    </style>

        // --- COMPOSANT : GRILLE AVEC FILTRES ---

        // --- COMPOSANT : SIMULATEUR D'ENTIERS REACT ---
        const IntegerSimulator = () => {
            const [a, setA] = useState(5);
            const [b, setB] = useState(3);
            const [op, setOp] = useState('+');
            const [dragging, setDragging] = useState(null); // 'a' ou 'b'
            const svgRef = useRef(null);

            const result = useMemo(() => op === '+' ? a + b : a - b, [a, b, op]);

            const { minX, maxX, range, svgWidth, unitX } = useMemo(() => {
                const points = [0, a, b, result];
                if (op === '-' && b !== 0) points.push(a - b);
                const visibleMin = Math.min(-10, ...points);
                const visibleMax = Math.max(10, ...points);
                const currentRange = visibleMax - visibleMin;
                const pad = Math.max(2, Math.floor(currentRange * 0.18));
                const calcMin = Math.max(-60, visibleMin - pad);
                const calcMax = Math.min(60, visibleMax + pad);
                return { minX: calcMin, maxX: calcMax, range: currentRange, svgWidth: 1000, unitX: 1000 / (calcMax - calcMin) };
            }, [a, b, op, result]);

            const valToX = (val) => (val - minX) * unitX;
            const xToVal = (clientX, rect) => Math.round(minX + ((clientX - rect.left) * (svgWidth / rect.width)) / unitX);

            const handlePointerMove = (e) => {
                if (!dragging || !svgRef.current) return;
                const rect = svgRef.current.getBoundingClientRect();
                let val = Math.max(-50, Math.min(50, xToVal(e.clientX, rect)));
                if (dragging === 'a') setA(val);
                if (dragging === 'b') setB(val);
            };

            const { ticks, minorTicks } = useMemo(() => {
                let step = range > 40 ? 5 : (range > 25 ? 2 : 1);
                const major = []; const minor = [];
                for (let i = Math.ceil(minX / step) * step; i <= maxX; i += step) major.push(i);
                if (step > 1) { for (let i = Math.ceil(minX); i <= maxX; i++) if (i % step !== 0) minor.push(i); }
                return { ticks: major, minorTicks: minor };
            }, [minX, maxX, range]);

            const NumberLineAxis = ({ y, label, emphasize = false }) => (
                <g>
                    <line x1={valToX(minX)} y1={y} x2={valToX(maxX)} y2={y} stroke={emphasize ? "#0f172a" : "#64748b"} strokeWidth={emphasize ? 3.5 : 2.5} />
                    {minorTicks.map(t => <line key={`m${t}`} x1={valToX(t)} y1={y - 4} x2={valToX(t)} y2={y + 4} stroke="#94a3b8" strokeWidth={1.5} />)}
                    {ticks.map(t => (
                        <g key={`t${t}`}>
                            <line x1={valToX(t)} y1={y - 7} x2={valToX(t)} y2={y + 7} stroke={t === 0 ? "#0f172a" : "#475569"} strokeWidth={t === 0 ? 4 : 2} />
                            <text x={valToX(t)} y={y + 24} textAnchor="middle" fontSize={emphasize ? 14 : 13} fontWeight="700" fill={t === 0 ? "#0f172a" : "#334155"} className="select-none font-mono">{t}</text>
                        </g>
                    ))}
                    <text x={10} y={y - 18} fontSize={14} fontWeight="800" fill="#1e2761" className="select-none uppercase tracking-wider">{label}</text>
                </g>
            );

            const LineArrow = ({ start, end, y, colorName, label, onDragStart = null }) => {
                const x1 = valToX(start); const x2 = valToX(end);
                const hex = colorName === 'pos' ? '#408ec6' : (colorName === 'neg' ? '#7a2048' : '#1e2761');
                if (start === end) {
                    return (
                        <g>
                            <circle cx={x1} cy={y} r={6} fill={hex} stroke="#fff" strokeWidth={1.5} />
                            {onDragStart && <g cursor="ew-resize" onPointerDown={onDragStart} className="touch-none"><circle cx={x1} cy={y} r={20} fill="transparent" /></g>}
                            <text x={x1} y={y - 14} textAnchor="middle" fill={hex} fontWeight="800" fontSize={13} className="font-mono">{label}</text>
                        </g>
                    );
                }
                return (
                    <g>
                        <line x1={x1} y1={y} x2={x2} y2={y} stroke={hex} strokeWidth={4} markerEnd={`url(#arrow-${colorName})`} />
                        <rect x={((x1+x2)/2) - 30} y={y - 24} width={60} height={18} fill="#fff" stroke="#cbd5e1" strokeWidth={1} rx={4} />
                        <text x={(x1+x2)/2} y={y - 11} textAnchor="middle" fill={hex} fontWeight="800" fontSize={12} className="select-none font-mono">{label}</text>
                        {onDragStart && (
                            <g cursor="ew-resize" onPointerDown={onDragStart} className="touch-none">
                                <circle cx={x2} cy={y} r={20} fill="transparent" />
                                <circle cx={x2} cy={y} r={7} fill={hex} stroke="#fff" strokeWidth={2} />
                            </g>
                        )}
                    </g>
                );
            };

            return (
                <div className="w-full bg-white rounded-3xl shadow-lg border border-slate-200 overflow-hidden animate-[fadeIn_0.3s_ease-out]">
                    <div className="bg-slate-50 border-b border-slate-100 p-4 flex flex-wrap items-center justify-between gap-4">
                        <div className="flex flex-wrap items-center gap-4 text-sm">
                            <div className="flex flex-col"><span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Terme A</span>
                                <input type="number" value={a} onChange={e => setA(Number(e.target.value) || 0)} className="w-20 px-2 py-1.5 text-center text-slate-900 font-bold bg-white rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-[#408ec6]" />
                            </div>
                            <div className="flex flex-col mt-4">
                                <select value={op} onChange={e => setOp(e.target.value)} className="px-3 py-1.5 font-extrabold bg-white rounded-xl border border-slate-300 cursor-pointer focus:outline-none focus:ring-2 focus:ring-[#408ec6]">
                                    <option value="+">+</option><option value="-">−</option>
                                </select>
                            </div>
                            <div className="flex flex-col"><span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Terme B</span>
                                <input type="number" value={b} onChange={e => setB(Number(e.target.value) || 0)} className="w-20 px-2 py-1.5 text-center text-slate-900 font-bold bg-white rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-[#408ec6]" />
                            </div>
                            <div className="flex flex-col mt-4"><div className="flex items-center gap-2 bg-slate-900 px-4 py-1.5 rounded-xl text-white font-black font-mono text-base">= {result}</div></div>
                        </div>
                    </div>

                    <div className="bg-slate-50/50 border-b border-slate-100 px-4 py-3 flex items-start gap-3 text-xs text-slate-600">
                        <Icon name="info" className="w-5 h-5 text-[#1e2761] mt-0.5 flex-shrink-0" />
                        <p className="font-medium leading-relaxed">{op === '+' ? "On part de A, puis on ajoute la value de B. Vers la droite si B est positif, vers la gauche si B est négatif." : "Soustraire B revient à ajouter l'opposé de B. On change ainsi le sens de la flèche de B."} Utilisez les curseurs ronds pour glisser directement les extrémités sur la droite.</p>
                    </div>

                    <div className="relative w-full overflow-hidden bg-white p-2 touch-none cursor-crosshair" onPointerMove={handlePointerMove} onPointerUp={() => setDragging(null)} onPointerLeave={() => setDragging(null)}>
                        <svg ref={svgRef} viewBox={`0 0 ${svgWidth} 480`} className="w-full h-auto block select-none">
                            <defs>
                                <marker id="arrow-pos" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#408ec6" /></marker>
                                <marker id="arrow-neg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7a2048" /></marker>
                                <marker id="arrow-result" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e2761" /></marker>
                            </defs>
                            <NumberLineAxis y={50} label="Valeur de A" />
                            <LineArrow start={0} end={a} y={50} colorName={a >= 0 ? 'pos' : 'neg'} label={`A = ${a}`} onDragStart={(e) => { setDragging('a'); e.target.setPointerCapture(e.pointerId); }} />
                            <NumberLineAxis y={140} label="Valeur de B" />
                            <LineArrow start={0} end={b} y={140} colorName={b >= 0 ? 'pos' : 'neg'} label={`B = ${b}`} onDragStart={(e) => { setDragging('b'); e.target.setPointerCapture(e.pointerId); }} />

                            <rect x="0" y="210" width="100%" height="250" fill="#f8fafc" />
                            <line x1="0" y1="210" x2="100%" y2="210" stroke="#cbd5e1" strokeWidth="2" />
                            <NumberLineAxis y={370} label="Exécution (Mise bout-à-bout)" emphasize={true} />

                            {op === '+' ? (
                                <g>
                                    <LineArrow start={0} end={a} y={325} colorName={a >= 0 ? 'pos' : 'neg'} label={`A (${a})`} />
                                    <LineArrow start={a} end={a + b} y={285} colorName={b >= 0 ? 'pos' : 'neg'} label={`+ B (${b >= 0 ? '+'+b : b})`} />
                                </g>
                            ) : (
                                <g>
                                    <LineArrow start={0} end={a} y={325} colorName={a >= 0 ? 'pos' : 'neg'} label={`A (${a})`} />
                                    <LineArrow start={a} end={a - b} y={285} colorName={-b >= 0 ? 'pos' : 'neg'} label={`- B (Opposé: ${-b >= 0 ? '+'+(-b) : -b})`} />
                                </g>
                            )}
                            <line x1={valToX(result)} y1={285} x2={valToX(result)} y2={370} stroke="#1e2761" strokeWidth={2} strokeDasharray="4,4" />
                            <circle cx={valToX(result)} cy={370} r={8} fill="#1e2761" stroke="#fff" strokeWidth={2} />
                            <text x={valToX(result)} y={430} textAnchor="middle" fill="#1e2761" fontWeight="800" fontSize={16} className="font-mono">Résultat: {result}</text>
                            <line x1={valToX(0)} y1={25} x2={valToX(0)} y2={410} stroke="#64748b" strokeWidth="1.5" strokeDasharray="5,5" opacity="0.4" />
                        </svg>
                    </div>
                </div>
            );
        };

        // --- COMPOSANT COMPLET APPLICATION ---
        const App = () => {
            const [currentView, setCurrentView] = useState('home');
            const [links, setLinks] = useState(DATA.links);
            const [toast, setToast] = useState(null);

            const viewData = DATA.views[currentView] || DATA.views['home'];

            const navigateBack = () => {
                if (currentView === 'tool-addsub') setCurrentView('arithmetique');
                else if (currentView === 'arithmetique') setCurrentView('simaths');
                else setCurrentView('home');
                window.scrollTo(0, 0);
            };

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 3000);
            };

            return (
                <div className="flex flex-col min-h-screen">
                    <style>{`
                        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
                    `}</style>
                    
                    {/* Header dynamique */}
                    <header className="w-full bg-gradient-to-r from-[#1e2761] via-[#7a2048] to-[#408ec6] text-white relative overflow-hidden shadow-lg shadow-[#1e2761]/15 z-40">
                        <div className="absolute -top-12 -left-12 w-48 h-48 bg-white/10 rounded-full blur-2xl"></div>
                        <div className="absolute -bottom-16 -right-16 w-72 h-72 bg-white/10 rounded-full blur-3xl"></div>
                        
                        <div className="max-w-7xl mx-auto px-6 py-6 md:py-8 flex flex-col sm:flex-row items-center justify-between gap-6 relative z-10">
                            <div className="flex items-center gap-4 flex-col sm:flex-row text-center sm:text-left">
                                <div className="w-14 h-14 rounded-2xl bg-white/10 border border-white/20 flex items-center justify-center backdrop-blur-md shadow-inner">
                                    <Icon name="sparkles" className="w-7 h-7 text-white animate-pulse" />
                                </div>
                                <div className="flex flex-col">
                                    <div className="text-[10px] uppercase tracking-widest text-white/70 font-bold mb-0.5">{viewData.breadcrumb}</div>
                                    <h1 className="text-2xl md:text-3xl font-black tracking-tight drop-shadow-sm">{viewData.title}</h1>
                                    <p className="text-xs md:text-sm font-semibold text-white/90 tracking-wide mt-1 flex items-center gap-2 justify-center sm:justify-start">
                                        <span className="flashing-symbol text-amber-300 text-lg font-bold font-mono">&infin;</span>
                                        en accompagnement depuis 1998 !
                                    </p>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-3">
                                {/* Liens de réseaux sociaux et courriel */}
                                <div className="flex items-center gap-2 mr-1">
                                    <a href="https://www.facebook.com/lapageadage" target="_blank" rel="noopener noreferrer" className="p-2.5 rounded-full bg-white/10 hover:bg-white/25 border border-white/20 backdrop-blur-md transition-all duration-300 text-white focus:outline-none hover:scale-110" title="Facebook">
                                        <Icon name="facebook" className="w-4.5 h-4.5 sm:w-5 sm:h-5" />
                                    </a>
                                    <a href="https://www.linkedin.com/in/jocedage/" target="_blank" rel="noopener noreferrer" className="p-2.5 rounded-full bg-white/10 hover:bg-white/25 border border-white/20 backdrop-blur-md transition-all duration-300 text-white focus:outline-none hover:scale-110" title="LinkedIn">
                                        <Icon name="linkedin" className="w-4.5 h-4.5 sm:w-5 sm:h-5" />
                                    </a>
                                    {/* Lien de courriel Jocedage */}
                                    <a href="mailto:jocedage@gmail.com" className="p-2.5 rounded-full bg-white/10 hover:bg-white/25 border border-white/20 backdrop-blur-md transition-all duration-300 text-white focus:outline-none hover:scale-110" title="Nous écrire par courriel">
                                        <Icon name="mail" className="w-4.5 h-4.5 sm:w-5 sm:h-5" />
                                    </a>
                                </div>
                                
                                {/* Bouton Retour dynamique */}
                                <button onClick={navigateBack} className={`px-5 py-2.5 rounded-xl bg-white/15 hover:bg-white/25 border border-white/20 backdrop-blur-md transition-all duration-300 text-xs sm:text-sm font-bold tracking-wide flex items-center gap-2.5 shadow-sm text-white focus:outline-none ${currentView === 'home' ? 'hidden' : 'flex'}`}>
                                    <Icon name="arrow-left" className="w-4 h-4" /> <span className="hidden sm:inline">Retour</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Contenu principal */}
                    <main className="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
                        {viewData.isTool ? (
                            <IntegerSimulator />
                        ) : (
                            <ViewGrid viewData={viewData} links={links} navigateTo={(v) => { setCurrentView(v); window.scrollTo(0, 0); }} />
                        )}
                    </main>

                    {/* Pied de page simplifié */}
                    <footer className="py-8 border-t border-slate-200/60 relative z-10 px-4 mt-auto">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6 text-center md:text-left">
                            <div className="flex items-center gap-2">
                                <div className="w-6 h-6 rounded-lg bg-gradient-to-tr from-[#408ec6] via-[#1e2761] to-[#7a2048] flex items-center justify-center">
                                    <Icon name="sparkles" className="w-3.5 h-3.5 text-white" />
                                </div>
                                <span className="font-extrabold text-sm tracking-wide bg-gradient-to-r from-slate-900 to-slate-600 bg-clip-text text-transparent">La Page @ Dage</span>
                            </div>
                            <p className="text-xs text-slate-500 font-medium">&copy; 2026 La Page @ Dage. Reproduction en tout ou en partie interdite.</p>
                        </div>
                    </footer>

                    {/* Toast Notification */}
                    <div className={`fixed bottom-6 left-1/2 -translate-x-1/2 z-50 transform transition-all duration-300 pointer-events-none ${toast ? 'translate-y-0 opacity-100' : 'translate-y-20 opacity-0'}`}>
                        <div className="bg-white border border-[#1e2761]/10 text-slate-800 px-5 py-3 rounded-xl flex items-center gap-2.5 shadow-2xl backdrop-blur-md text-sm font-bold">
                            <Icon name="check-circle" className="w-4 h-4 text-[#1e2761]" /> <span>{toast}</span>
                        </div>
                    </div>
                </div>
            );
        };

        // Lancement de l'application
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
